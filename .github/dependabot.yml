version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    # Group bumps so companion packages move together and the locked
    # requirements.txt stays internally resolvable (avoids one-leaf-at-a-time
    # conflicts that fail the pip-compile validation).
    groups:
      python-deps:
        patterns: ["*"]
  # CI/CD workflow actions are pinned by SHA; keep them current too.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns: ["*"]
